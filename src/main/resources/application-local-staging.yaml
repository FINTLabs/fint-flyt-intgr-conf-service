fint:
  org-id: novari.no
  # I drift kommer disse fra secreten flaiserator monterer. Lokalt finnes ingen
  # authorization-service å snakke med, men oauth2-klienten må bygges for at konteksten skal starte.
  flyt:
    authorization:
      sso:
        client-id: local
        client-secret: local

novari:
  flyt:
    catalog:
      database:
        schema-prefix: ""

    web-resource-server:
      security:
        api:
          internal:
            authorized-org-id-role-pairs-json: "{\"vigo.no\":[\"DEVELOPER\"]}"

    audit:
      authorization:
        base-url: 'http://localhost:8084'

  kafka:
    default-replicas: 1
    topic:
      org-id: novari-no

spring:
  kafka:
    bootstrap-servers: localhost:9192
  datasource:
    url: jdbc:postgresql://localhost:5441/fint-flyt-intgr-conf-service
    username: postgres
    password: password

server:
  port: 8095
