fint:
  application-id: fint-flyt-intgr-conf-service

server:
  error:
    include-message: always
  # Arvet fra discovery-service, som har hevet grensen fra Tomcats 8KB siden 2022. Begrunnelsen står
  # ingen steder, men uten den kan en request som i dag får 200 få 431 etter cutover.
  max-http-request-header-size: 40KB

spring:
  profiles:
    include:
      - flyt-logging
      - flyt-postgres
      - flyt-kafka
      - flyt-authorization-client
  output:
    ansi:
      enabled: always

novari:
  flyt:
    security:
      # Open as before; the ingress only routes /api/intern/*, so these are reached with port-forward only.
      public-paths:
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs
        - /v3/api-docs/**
        - /v3/api-docs.yaml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
