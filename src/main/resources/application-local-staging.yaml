fint:
  org-id: novari.no
  # I drift kommer disse fra secreten flaiserator monterer. Lokalt finnes ingen
  # authorization-service å snakke med, men oauth2-klienten må bygges for at konteksten skal starte.
  flyt:
    authorization:
      sso:
        client-id: local
        client-secret: local

novari:
  flyt:
    catalog:
      database:
        schema-prefix: ""

    security:
      user:
        audience: local-frontend-client

    audit:
      authorization:
        base-url: 'http://localhost:8084'

  kafka:
    topic:
      org-id: novari-no
      default-replicas: 1

spring:
  kafka:
    bootstrap-servers: localhost:9192
  datasource:
    url: jdbc:postgresql://localhost:5441/fint-flyt-intgr-conf-service
    username: postgres
    password: password

server:
  port: 8095
