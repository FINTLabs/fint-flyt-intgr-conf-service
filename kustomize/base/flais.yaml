apiVersion: fintlabs.no/v1alpha1
kind: Application
metadata:
  name: fint-flyt-intgr-conf-service
  namespace: fintlabs-no
  labels:
    app.kubernetes.io/name: fint-flyt-intgr-conf-service
    app.kubernetes.io/instance: fint-flyt-intgr-conf-service_fintlabs_no
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fint-flyt
    fintlabs.no/team: flyt
    fintlabs.no/org-id: fintlabs.no
# Katalogen har overtatt alle fire domenene, og rutene her dekker dem alle. Topic-konfigurasjon
# opprettes og endres når konsument-bønnene bygges, altså ved oppstart, så en tenant må ha fått den
# gamle tjenestens deployment slettet før denne starter.
spec:
  port: 8080
  imagePullPolicy: Always
  orgId: fintlabs.no
  image: ghcr.io/fintlabs/fint-flyt-intgr-conf-service:sha-0000000
  kafka:
    enabled: true
    acls:
      - permission: admin
        topic: 'no-permission'
  database:
    database: fint-flyt
  url:
    hostname: flyt.vigoiks.no
    basePath: ""
  ingress:
    # Én rute per domene, i den rekkefølgen overlay-malen patcher dem: 0 = /api/intern/value-convertings,
    # 1 = /api/intern/metadata, 2 = /api/intern/integrasjoner, 3 = /api/intern/konfigurasjoner.
    routes:
      - host: flyt.vigoiks.no
        path: path
      - host: flyt.vigoiks.no
        path: path
      - host: flyt.vigoiks.no
        path: path
      - host: flyt.vigoiks.no
        path: path
  env:
    - name: JAVA_TOOL_OPTIONS
      value: '-XX:+ExitOnOutOfMemoryError -Xmx1536M -Xms1536M'
    - name: fint.flyt.authorization.sso.client-id
      valueFrom:
        secretKeyRef:
          name: fint-flyt-authorization-oauth2-client
          key: fint.sso.client-id
    - name: fint.flyt.authorization.sso.client-secret
      valueFrom:
        secretKeyRef:
          name: fint-flyt-authorization-oauth2-client
          key: fint.sso.client-secret
  # Taket følger den største tjenesten katalogen har overtatt, slik at den sammenslåtte podden
  # aldri er mindre enn en av delene var alene. discovery-service kjørte på 2048Mi og -Xmx1840M.
  resources:
    limits:
      memory: "2048Mi"
      cpu: "500m"
    requests:
      memory: "512Mi"
      cpu: "150m"
  probes:
    startup:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 70
      failureThreshold: 12
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /actuator/health/readiness
      port: 8080
      initialDelaySeconds: 0
      failureThreshold: 5
      periodSeconds: 10
      timeoutSeconds: 3
    liveness:
      path: /actuator/health/liveness
      port: 8080
      initialDelaySeconds: 0
      failureThreshold: 5
      periodSeconds: 10
      timeoutSeconds: 3
  observability:
    metrics:
      enabled: true
      port: "8080"
      path: /actuator/prometheus
  restartPolicy: Always
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
